<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Contato</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-container">
    <h2>Fale Conosco</h2>
    
    <form action="https://formspree.io/f/mppqgdwz" method="POST">
      <div class="input-group">
        <label for="email">Seu e-mail:</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
      </div>

      <div class="input-group">
        <label for="phone">Telefone / WhatsApp:</label>
        <input type="tel" id="phone" name="phone" placeholder="(00) 90000-0000">
      </div>

      <div class="input-group">
        <label for="city">Cidade:</label>
        <input type="text" id="city" name="city" placeholder="Sua cidade - UF">
      </div>

      <div class="input-group">
        <label for="message">Sua mensagem:</label>
        <textarea id="message" name="message" rows="4" placeholder="Escreva sua mensagem aqui..." required></textarea>
      </div>

      <button type="submit">Enviar Mensagem</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
